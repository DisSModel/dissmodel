name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # permite rodar manualmente para testar

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        # keep in sync with the `ruff` pin in pyproject.toml's `dev` extra —
        # see [tool.ruff]'s comment for why the version is pinned at all
        run: pip install "ruff>=0.16,<0.17"

      - name: Run Ruff
        run: ruff check dissmodel/

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgdal-dev gdal-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Coverage XML is produced but not uploaded anywhere yet — wiring
      # Codecov (account + token) is a follow-up; the README badge is
      # static until then.
      - name: Run tests with coverage
        run: pytest tests/ --cov=dissmodel --cov-report=term-missing --cov-report=xml

      # All >>> examples in the package are self-contained doctests;
      # illustrative snippets use plain ```python fences instead
      # (see CONTRIBUTING.md, "Documentation / Docstrings").
      - name: Run doctests
        run: pytest --doctest-modules dissmodel

      # No --ignore-missing-imports here: [tool.mypy] in pyproject.toml
      # already lists every stub-less dependency by module name. A blanket
      # flag here would silently re-mask first-party import typos again
      # (see CHANGELOG 0.6.5) regardless of what pyproject.toml says.
      - name: Run mypy
        run: mypy dissmodel