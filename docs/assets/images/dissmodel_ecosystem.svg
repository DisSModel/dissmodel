<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 706" width="100%" role="img" font-family="Outfit, sans-serif">
  <rect width="1120" height="706" fill="#ffffff"/>
  <title>DisSModel ecosystem map</title>
  <desc>DisSModel mirrors the TerraME ecosystem from INPE as an independent Python alternative: TerraME is the conceptual basis for the dissmodel core; TerraME's cellular automata, system dynamics and agent-based packages correspond to dissmodel-ca, dissmodel-sysdyn and dissmodel-abm; LuccME corresponds to disslucc; fillCell corresponds to disscube. haloexec and dissmodel-platform are new infrastructure for scale and reproducible execution.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .lbl  { font-size: 12px; font-weight: 700; letter-spacing: .1em; fill: #2e6fb5; }
      .lblg { font-size: 12px; font-weight: 700; letter-spacing: .1em; fill: #7d8ea6; }
      .nm   { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; fill: #1a2e4a; }
      .nmg  { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; fill: #5a7090; }
      .ds   { font-size: 13px; fill: #5a7090; }
      .note { font-size: 12px; fill: #5a7090; font-style: italic; }
      .ok   { fill: #4a9e4a; } .early { fill: #e8a020; }
    </style>
  </defs>

  <!-- Column headers -->
  <text class="lblg" x="40" y="30">REFERENCE · INPE</text>
  <text class="lbl" x="360" y="30">DISSMODEL ECOSYSTEM · PYTHON</text>

  <!-- Row A: core -->
  <rect x="40" y="46" width="220" height="72" rx="10" fill="none" stroke="#9fb0c6" stroke-dasharray="5 4"/>
  <text class="nmg" x="58" y="76">TerraME</text>
  <text class="ds" x="58" y="100">Spatial dynamic modeling (Lua)</text>

  <text class="note" x="310" y="74" text-anchor="middle">conceptual basis</text>
  <path d="M266 88 L352 88" fill="none" stroke="#9fb0c6" stroke-dasharray="4 4" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="360" y="46" width="720" height="72" rx="12" fill="#1a2e4a"/>
  <circle class="ok" cx="1062" cy="62" r="5"/>
  <text x="380" y="76" font-family="'DM Mono', monospace" font-size="19" font-weight="500" fill="#ffffff">dissmodel</text>
  <text x="380" y="100" font-size="13" fill="#a0c0e0">Core · Environment, Model, vector &amp; raster cellular spaces, scheduling</text>

  <!-- Row B: didactic packages -->
  <text class="lbl" x="360" y="152">DIDACTIC PACKAGES · MODELING PARADIGMS</text>
  <rect x="40" y="164" width="220" height="72" rx="10" fill="none" stroke="#9fb0c6" stroke-dasharray="5 4"/>
  <text class="nmg" x="58" y="194">TerraME packages</text>
  <text class="ds" x="58" y="218">CA · sysdyn · ABM</text>

  <text class="note" x="310" y="192" text-anchor="middle">similar packages</text>
  <path d="M266 206 L352 206" fill="none" stroke="#9fb0c6" stroke-dasharray="4 4" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="360" y="164" width="228" height="72" rx="10" fill="#e8f0fb" stroke="#b9d0ee"/>
  <circle class="early" cx="572" cy="180" r="5"/>
  <text class="nm" x="376" y="194">dissmodel-ca</text>
  <text class="ds" x="376" y="218">Cellular automata</text>

  <rect x="606" y="164" width="228" height="72" rx="10" fill="#e8f0fb" stroke="#b9d0ee"/>
  <circle class="early" cx="818" cy="180" r="5"/>
  <text class="nm" x="622" y="194">dissmodel-sysdyn</text>
  <text class="ds" x="622" y="218">System dynamics</text>

  <rect x="852" y="164" width="228" height="72" rx="10" fill="#e8f0fb" stroke="#b9d0ee"/>
  <circle class="early" cx="1064" cy="180" r="5"/>
  <text class="nm" x="868" y="194">dissmodel-abm</text>
  <text class="ds" x="868" y="218">Agent-based models</text>

  <!-- Row C: domain -->
  <text class="lbl" x="360" y="270">DOMAIN</text>
  <rect x="40" y="282" width="220" height="72" rx="10" fill="none" stroke="#9fb0c6" stroke-dasharray="5 4"/>
  <text class="nmg" x="58" y="312">LuccME</text>
  <text class="ds" x="58" y="336">LUCC framework on TerraME</text>

  <text class="note" x="310" y="302" text-anchor="middle">independent</text>
  <text class="note" x="310" y="317" text-anchor="middle">alternative</text>
  <path d="M266 330 L352 330" fill="none" stroke="#9fb0c6" stroke-dasharray="4 4" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="360" y="282" width="474" height="72" rx="10" fill="#e8f4e8" stroke="#bfdcbf"/>
  <circle class="early" cx="818" cy="298" r="5"/>
  <text class="nm" x="376" y="312">disslucc</text>
  <text class="ds" x="376" y="336">Land use &amp; cover change · Demand · Potential · Allocation</text>

  <!-- Row D: data preparation -->
  <text class="lbl" x="360" y="388">DATA PREPARATION · CELLULAR SPACES</text>
  <rect x="40" y="400" width="220" height="72" rx="10" fill="none" stroke="#9fb0c6" stroke-dasharray="5 4"/>
  <text class="nmg" x="58" y="430">fillCell</text>
  <text class="ds" x="58" y="454">Filling cells with data</text>

  <text class="note" x="310" y="428" text-anchor="middle">similar role</text>
  <path d="M266 442 L352 442" fill="none" stroke="#9fb0c6" stroke-dasharray="4 4" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="360" y="400" width="474" height="72" rx="10" fill="#ffffff" stroke="#dde4ee" stroke-width="1.5"/>
  <circle class="early" cx="818" cy="416" r="5"/>
  <text class="nm" x="376" y="430">disscube</text>
  <text class="ds" x="376" y="454">Chunked raster cubes · grid alignment · cell filling</text>

  <!-- Row E: infrastructure -->
  <text class="lbl" x="360" y="506">INFRASTRUCTURE · BEYOND TERRAME</text>
  <text class="note" x="40" y="542">No direct counterpart:</text>
  <text class="note" x="40" y="560">an evolution toward scale and</text>
  <text class="note" x="40" y="578">reproducible execution</text>

  <rect x="360" y="518" width="350" height="90" rx="10" fill="#ffffff" stroke="#dde4ee" stroke-width="1.5"/>
  <circle class="early" cx="694" cy="534" r="5"/>
  <text class="nm" x="376" y="548">haloexec</text>
  <text class="ds" x="376" y="572">Larger-than-RAM CA · halo / ghost cells</text>
  <text class="note" x="376" y="592">may later move into the core</text>

  <rect x="730" y="518" width="350" height="90" rx="10" fill="#fdf3e0" stroke="#f0d9a8" stroke-dasharray="6 4"/>
  <circle class="early" cx="1064" cy="534" r="5"/>
  <text class="nm" x="746" y="548">dissmodel-platform</text>
  <text class="ds" x="746" y="572">JupyterLab · FastAPI · MinIO · Redis · provenance</text>
  <text class="note" x="746" y="592">prototype, not yet hardened</text>

  <!-- Legend -->
  <line x1="40" y1="634" x2="1080" y2="634" stroke="#dde4ee"/>
  <circle class="ok" cx="46" cy="658" r="5"/><text class="ds" x="58" y="662">More mature</text>
  <circle class="early" cx="166" cy="658" r="5"/><text class="ds" x="178" y="662">Early stage · in development</text>
  <text class="note" x="1080" y="662" text-anchor="end">All packages build on the dissmodel core.</text>
  <text class="note" x="40" y="690">An early snapshot: most packages are just getting started, and boundaries and APIs will change. Feedback is very welcome.</text>
</svg>
