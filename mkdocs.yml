site_name: DisSModel
site_description: "Discrete spatial modeling framework for Python: cellular automata and system dynamics on vector and raster substrates."
site_author: "LambdaGeo / UFMA"
site_url: https://dissmodel.github.io/dissmodel/
repo_url: https://github.com/DisSModel/dissmodel
repo_name: DisSModel/dissmodel
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - javascripts/mathjax-config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Getting started:
      - Installation and first model: getting_started.md
  - Guides:
      - Why DisSModel?: why_dissmodel.md
      - Examples:
          - Overview: examples.md
          - CLI Examples: examples/cli.md
          - Streamlit Examples: examples/streamlit.md
          - Vector to Raster: examples/vector_to_raster.md
          - Notebooks:
              - Game of Life: examples/notebooks/ca_game_of_life.ipynb
              - SIR Model: examples/notebooks/sysdyn_sir.ipynb
  - Reference:
      - Core: api/core.md
      - Geo:
          - Overview: api/geo/index.md
          - Vector: api/geo/vector.md
          - Raster: api/geo/raster.md
      - Executor:
          - Overview: api/executor/index.md
          - Schemas: api/executor/schemas.md
          - CLI: api/executor/cli.md
          - Testing: api/executor/testing.md
      - IO: api/io/index.md
      - Visualization: api/visualization.md
