[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dissmodel"
version = "0.6.5"
description = "Discrete Spatial Modeling framework for raster and vector simulations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

authors = [
    { name = "Sérgio Souza Costa" },
    { name = "Nerval de Jesus Santos Junior" },
    { name = "Felipe Martins Sousa" },
    { name = "Denilson da Silva Bezerra" },
]

maintainers = [
    { name = "Sérgio Souza Costa" }
]

license = { text = "MIT" }

keywords = [
    "spatial modeling",
    "geospatial simulation",
    "cellular automata",
    "gis",
    "raster modeling",
    "vector modeling"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic-settings",
    "pydantic>=2.0",
    "numpy>=1.24,<3.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "libpysal>=4.9.0",
    "matplotlib>=3.7.0",
    "rasterstats>=0.19.0",
    "affine>=2.4.0",
    "scipy>=1.12.0",        # RasterBackend.neighbor_contact's binary_dilation; was
                             # only a transitive pull via libpysal, now declared directly
    "tomli>=2.0; python_version < '3.11'",   # tomllib backport for Python 3.10
]

[project.optional-dependencies]

viz = [
    "ipywidgets>=8.0.0",   # Colab/Jupyter visualization — anchored Output widget
]

s3 = [
    "minio>=7.0",   # dissmodel.io._storage's client for s3:// URIs — talks to
                     # any S3-compatible endpoint (standalone MinIO, AWS S3,
                     # etc.), no dependency on the rest of dissmodel-platform
]

xarray = [
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",       # backend for to_netcdf / open_dataset
    "zarr>=2.16.0",         # backend for to_zarr / open_zarr (MinIO/S3)
    "pyproj>=3.4.0",        # CRS → spatial_ref (CF convention)
    "rasterio>=1.3.0",      # Affine transform recovery in from_xarray
]

dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff>=0.16,<0.17",     # pinned minor: ruff's *default* rule set has grown across versions
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-material",
    # xarray extras useful during development
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",
    "zarr>=2.16.0",
    "pyproj>=3.4.0",
    "rasterio>=1.3.0",
    # s3 extra, plus a real (in-process, no Docker) S3-protocol server for
    # tests/io/test_s3_real.py — see the [s3] extra for the runtime piece
    "minio>=7.0",
    "moto[s3,server]>=5.0",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]

[project.urls]
Homepage = "https://github.com/DisSModel/dissmodel"
Repository = "https://github.com/DisSModel/dissmodel"
Documentation = "https://dissmodel.github.io/dissmodel/"
Issues = "https://github.com/DisSModel/dissmodel/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dissmodel*"]

[tool.setuptools.package-data]
"dissmodel" = ["*.json", "*.csv", "*.shp", "*.geojson", "*.tif"]

[tool.ruff]
# No explicit `select`: we lint with ruff's own default rule set, which is
# wider than "pyflakes + pycodestyle errors" as of the 0.16.x line pinned
# above (isort, pyupgrade, ruff-specific, flake8-bandit/pie/simplify/pyi
# checks are on by default too). If bumping the pinned ruff minor version
# changes CI results, that's this rule set growing again — reconcile by
# either fixing the code or, if a rule is a bad fit for this project,
# adding it to an explicit `ignore` here (not by re-pinning silently).
# line-length is informational for now — E501 is not in the default rules,
# so existing long lines do not fail the lint step.
line-length = 120
target-version = "py310"
exclude = ["docs", "site", "build"]

[tool.pytest.ini_options]
# tests/ is not a package; test modules import helpers as
# "tests.executor.conftest", which requires the repo root on sys.path.
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
exclude = ["tests/", "docs/", "examples/"]

[[tool.mypy.overrides]]
# Third-party (or optional-extra) dependencies with no bundled type stubs.
# This is deliberately per-module, not a blanket `ignore_missing_imports`
# at the top level: a global setting also silences typos in *our own*
# first-party import paths (see CHANGELOG 0.6.5 — that's exactly how the
# dissmodel.core.base / dissmodel.executor.model_executor mismatch went
# unnoticed). Add a module here only when it genuinely has no stubs.
module = [
    "geopandas.*",
    "shapely.*",
    "matplotlib.*",
    "rasterstats.*",
    "libpysal.*",
    "streamlit.*",
    "IPython.*",
    "affine.*",
    "xarray.*",
    "netCDF4.*",
    "zarr.*",
    "pyproj.*",
    "rasterio.*",
    "scipy.*",
    "minio",               # optional [s3] extra
    "google.colab",        # only ever present inside Colab itself
    "ipywidgets",           # optional [viz] extra
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zarr 3.x ships py.typed source using PEP 695 syntax (Python 3.12+),
# which mypy cannot parse under python_version = "3.10". Never analyze it.
module = ["zarr.*"]
follow_imports = "skip"
ignore_errors = true
